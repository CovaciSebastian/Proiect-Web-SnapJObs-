<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setare Parolă Nouă - SnapJobs</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/header-styles.css">
</head>
<body class="dark-theme">
    <div style="max-width: 400px; margin: 100px auto; padding: 40px; background: #1a1620; border-radius: 12px; border: 1px solid #333; text-align: center;">
        <h1 style="color: #29b6f6;">Parolă Nouă</h1>
        
        <form id="resetForm" style="margin-top: 20px;">
            <input type="password" id="password" required placeholder="Noua parolă" style="width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 15px;">
            <button type="submit" style="width: 100%; padding: 12px; background: #29b6f6; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Schimbă Parola</button>
        </form>
        <p id="msg" style="margin-top: 15px; color: #ccc; display: none;"></p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.body.innerHTML = '<h1 style="color:white;text-align:center;margin-top:50px;">Link invalid.</h1>';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();
                
                msg.style.display = 'block';
                msg.textContent = data.message;
                
                if (data.success) {
                    msg.style.color = '#4caf50';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    msg.style.color = 'red';
                }
            } catch (err) {
                msg.style.display = 'block';
                msg.textContent = "Eroare server.";
                msg.style.color = 'red';
            }
        });
    </script>
</body>
</html>

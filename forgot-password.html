<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resetare Parolă - SnapJobs</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/header-styles.css">
</head>
<body class="dark-theme">
    <div style="max-width: 400px; margin: 100px auto; padding: 40px; background: #1a1620; border-radius: 12px; border: 1px solid #333; text-align: center;">
        <h1 style="color: #29b6f6;">Am uitat parola</h1>
        <p style="color: #ccc;">Introdu adresa de email pentru a primi un link de resetare.</p>
        
        <form id="forgotForm" style="margin-top: 20px;">
            <input type="email" id="email" required placeholder="Email-ul tău" style="width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 15px;">
            <button type="submit" style="width: 100%; padding: 12px; background: #29b6f6; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Trimite Link</button>
        </form>
        <p id="msg" style="margin-top: 15px; color: #ccc; display: none;"></p>
        <div style="margin-top: 20px;">
            <a href="login.html" style="color: #888;">Înapoi la Logare</a>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msg = document.getElementById('msg');
            
            try {
                const res = await fetch('http://localhost:3000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                msg.style.display = 'block';
                msg.textContent = data.message;
                if(data.success) msg.style.color = '#4caf50';
            } catch (err) {
                msg.style.display = 'block';
                msg.textContent = "Eroare server.";
                msg.style.color = 'red';
            }
        });
    </script>
</body>
</html>

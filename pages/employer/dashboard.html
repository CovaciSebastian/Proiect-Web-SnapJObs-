<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapJobs - Angajator Dashboard</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" href="../../assets/css/header-styles.css">
    <style>
        .dashboard-content {
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        .btn-add-job {
            background-color: #29b6f6;
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .job-card-employer {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 8px;
            position: relative;
        }

        .applicant-count {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #333;
            color: #29b6f6;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            border: 1px solid #29b6f6;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
        }

        .modal-content {
            background-color: #1a1a1a;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #29b6f6;
            width: 80%;
            max-width: 600px;
            border-radius: 8px;
            color: #fff;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #fff;
        }

        .applicant-list {
            margin-top: 20px;
        }

        .applicant-item {
            border-bottom: 1px solid #333;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-accept {
            background: #4caf50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        .btn-reject {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .status-badge {
            font-size: 0.8em;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .status-pending { background: #333; color: #fff; }
        .status-accepted { background: #4caf50; color: #fff; }
        .status-rejected { background: #f44336; color: #fff; }
    </style>
</head>
<body class="dark-theme">
    <!-- Applicants Modal -->
    <div id="applicantsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalJobTitle">Aplicanți</h2>
            <div id="applicantsList" class="applicant-list">
                <!-- Applicants will be loaded here -->
            </div>
        </div>
    </div>
    <header class="header-1">
      <button class="colaps" onclick="showModala()">
        <div class="icon-cart">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="feather feather-align-justify">
            <line x1="21" y1="10" x2="3" y2="10"></line>
            <line x1="21" y1="6" x2="3" y2="6"></line>
            <line x1="21" y1="14" x2="3" y2="14"></line>
            <line x1="21" y1="18" x2="3" y2="18"></line>
          </svg>
        </div>
      </button>

      <div class="logo">
        <a href="../../index.html"><img src="../../assets/img/SnapJobs_logo_mare-removebg-preview.png" alt="SnapJobs Logo"></a>
      </div>

      <div class="header-actions">
        <div class="auth-buttons">
            <a href="../../login.html" class="auth-btn btn-login">Logare</a>
            <a href="../../register.html" class="auth-btn btn-signup">Înregistrare</a>
        </div>
        <div class="icon-applications">
            <a href="../student/applications.html" onclick="handleSidebarLinkClick(event, 'pages/student/applications.html')">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2"/>
                <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            </svg>
            <span id="applicationCount" class="job-bubble">0</span>
            </a>
        </div>
      </div>
    </header>

    <!-- MENIU LATERAL (Sidebar) -->
    <div class="side-nav">
      <a href="../../index.html" onclick="handleSidebarLinkClick(event, 'index.html')">Acasă</a>
      <a href="../student/dashboard.html" onclick="handleSidebarLinkClick(event, 'pages/student/dashboard.html')">Găsește Joburi</a>
      <a href="../student/applications.html" onclick="handleSidebarLinkClick(event, 'pages/student/applications.html')">Aplicațiile mele</a>
      <a href="../student/profile.html" onclick="handleSidebarLinkClick(event, 'pages/student/profile.html')">Profilul meu</a>
      <a href="../../faq.html" onclick="handleSidebarLinkClick(event, 'faq.html')">FAQ</a>
      <a href="../../terms.html" onclick="handleSidebarLinkClick(event, 'terms.html')">Termeni și Condiții</a>
      <a href="dashboard.html" onclick="handleSidebarLinkClick(event, 'pages/employer/dashboard.html')" style="color: #29b6f6;">Zona Angajatori</a>
      <a href="../../login.html" onclick="handleSidebarLinkClick(event, 'login.html')">Logout</a>
    </div>

    <div class="dashboard-content">
        <div class="dashboard-header">
            <h1 style="color: #fff;">Panou de Control</h1>
            <a href="post-job.html" class="btn-add-job">+ Adaugă Job Nou</a>
        </div>

        <h2 style="color: #29b6f6; margin-bottom: 20px;">Joburi Active</h2>
        <div id="employerJobsList" class="jobs-grid">
            <!-- Jobs will be loaded here -->
        </div>
    </div>

    <script src="../../assets/js/sidebar.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const list = document.getElementById('employerJobsList');
            // Auth check handled by auth.js + backend
            
            // Wait for auth check to populate sessionStorage if needed, or just try fetching
            // The backend /api/jobs likely needs updating to filter by 'me' if employer?
            // Wait, the original code fetched ALL jobs and filtered client side by currentUser.id.
            // currentUser came from localStorage.
            
            // We need to know who the current user is.
            // auth.js sets sessionStorage.getItem('currentUserId').
            
            // We should delay slightly or retry if ID is missing? 
            // Better: Let's fetch jobs. If the backend is secure, maybe we should have an endpoint for "my jobs"?
            // The current endpoint /api/jobs returns all jobs.
            
            const currentUserId = sessionStorage.getItem('currentUserId');
            // If auth.js hasn't run yet, this might be null.
            // However, auth.js runs on DOMContentLoaded too. Race condition.
            
            // Let's rely on the fetch.
            
            try {
                const res = await fetch('http://localhost:3000/api/jobs', { credentials: 'include' });
                const allJobs = await res.json();
                
                // We need the user ID to filter.
                // If we don't have it in sessionStorage, we might need to wait or fetch status ourselves.
                // But auth.js runs checkAuthStatus().
                
                // Let's fetch status directly here to be safe/sure.
                const statusRes = await fetch('http://localhost:3000/api/auth/status', { credentials: 'include' });
                const statusData = await statusRes.json();
                
                if (!statusData.isAuthenticated) {
                     window.location.href = "../../login.html";
                     return;
                }
                
                const myId = statusData.user.id;
                
                // Filter by my ID
                const myJobs = allJobs.filter(job => job.employer_id === myId);

                if (myJobs.length === 0) {
                    list.innerHTML = '<p style="color: #888;">Nu ai publicat niciun job încă.</p>';
                    return;
                }

                myJobs.forEach(job => {
                    const applicants = job.applicantsCount || 0;
                    
                    const card = document.createElement('div');
                    card.className = 'job-card-employer';
                    card.id = `job-${job.id}`; // Add ID to card for easier removal
                    card.innerHTML = `
                        <div class="applicant-count">${applicants} Aplicanți</div>
                        <h3 style="color: #fff; margin-top: 0;">${job.title}</h3>
                        <p style="color: #888; font-size: 0.9em;">📅 ${job.date || 'Flexibil'}</p>
                        <p style="color: #fff; font-weight: bold; margin: 10px 0;">${job.salary}</p>
                        <p style="color: #aaa; font-size: 0.9em;">${job.location}</p>
                        <div style="margin-top: 15px;">
                            <a href="edit-job.html?id=${job.id}" style="text-decoration: none; background: transparent; border: 1px solid #555; color: #fff; padding: 5px 10px; cursor: pointer; display: inline-block;">Editează</a>
                            <button onclick="viewApplicants(${job.id}, '${job.title.replace(/'/g, "\\'")}')" style="text-decoration: none; background: transparent; border: 1px solid #29b6f6; color: #29b6f6; padding: 5px 10px; cursor: pointer; margin-left: 10px; display: inline-block;">Vezi Aplicanți</button>
                            <button onclick="deleteJob(${job.id})" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 5px 10px; cursor: pointer; margin-left: 10px; display: inline-block;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                            </button>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                list.innerHTML = '<p style="color: red;">Eroare la încărcarea joburilor.</p>';
            }
        });

        async function viewApplicants(jobId, jobTitle) {
            const modal = document.getElementById('applicantsModal');
            const list = document.getElementById('applicantsList');
            const title = document.getElementById('modalJobTitle');

            title.innerText = `Aplicanți pentru: ${jobTitle}`;
            list.innerHTML = '<p>Se încarcă...</p>';
            modal.style.display = 'block';

            try {
                const res = await fetch(`http://localhost:3000/api/applications/job/${jobId}`, {
                    credentials: 'include'
                });
                const data = await res.json();

                if (!res.ok) {
                    list.innerHTML = `<p style="color: red;">Eroare: ${data.message || 'Nu s-au putut încărca aplicanții.'}</p>`;
                    return;
                }

                if (data.length === 0) {
                    list.innerHTML = '<p style="color: #888;">Nicio aplicație încă.</p>';
                    return;
                }

                list.innerHTML = '';
                data.forEach(app => {
                    const item = document.createElement('div');
                    item.className = 'applicant-item';
                    
                    const currentStatus = app.status || 'pending';
                    let statusHtml = '';

                    if (currentStatus === 'pending') {
                        statusHtml = `
                            <div>
                                <button class="btn-accept" onclick="updateStatus(${app.id}, 'accepted', ${jobId}, '${jobTitle.replace(/'/g, "\\'")}')">Acceptă</button>
                                <button class="btn-reject" onclick="updateStatus(${app.id}, 'rejected', ${jobId}, '${jobTitle.replace(/'/g, "\\'")}')">Refuză</button>
                            </div>
                        `;
                    } else {
                        statusHtml = `<span class="status-badge status-${currentStatus}">${currentStatus.toUpperCase()}</span>`;
                    }

                    item.innerHTML = `
                        <div>
                            <div style="font-weight: bold;">${app.student.name}</div>
                            <div style="font-size: 0.8em; color: #aaa;">${app.student.email} | ${app.student.university || 'N/A'}</div>
                        </div>
                        ${statusHtml}
                    `;
                    list.appendChild(item);
                });
            } catch (error) {
                console.error(error);
                list.innerHTML = '<p style="color: red;">Eroare la încărcarea aplicanților.</p>';
            }
        }

        function closeModal() {
            document.getElementById('applicantsModal').style.display = 'none';
        }

        async function updateStatus(applicationId, status, jobId, jobTitle) {
            try {
                const res = await fetch(`http://localhost:3000/api/applications/${applicationId}/status`, {
                    method: 'PATCH',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ status })
                });

                if (res.ok) {
                    // Refresh the applicants list
                    viewApplicants(jobId, jobTitle);
                } else {
                    alert('Eroare la actualizarea statusului.');
                }
            } catch (error) {
                console.error(error);
                alert('Eroare server.');
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('applicantsModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        async function deleteJob(jobId) {
            const confirmDelete = confirm("Ești sigur că vrei să ștergi acest job? Această acțiune este ireversibilă!");
            if (!confirmDelete) return;

            try {
                const res = await fetch(`http://localhost:3000/api/jobs/${jobId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (res.ok) {
                    alert('Job șters cu succes!');
                    document.getElementById(`job-${jobId}`).remove(); // Remove from DOM
                } else {
                    const errorData = await res.json();
                    alert(errorData.message || 'Eroare la ștergerea jobului.');
                }
            } catch (error) {
                console.error(error);
                alert('Eroare server.');
            }
        }
    </script>
</body>
</html>
